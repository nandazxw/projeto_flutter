name: Compilar APK Android

on:
  push:
    branches: [ main ] # Executa toda vez que você fizer um git push para a branch main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do seu repositório no servidor do GitHub
    - name: Checkout do código
      uses: actions/checkout@v3

    # 2. Configura a versão do Java necessária para compilar o Android
    - name: Configurar Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. Instala e configura o ambiente do Flutter
    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    # 4. Baixa os pacotes/dependências do seu pubspec.yaml
    - name: Instalar dependências
      run: flutter pub get

    # 5. Gera o arquivo APK em modo Release
    - name: Gerar APK
      run: flutter build apk --release

    # 6. Disponibiliza o arquivo APK gerado para download
    - name: Enviar APK para o GitHub
      uses: actions/upload-artifact@v3
      with:
        name: meu-app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk