name: Compilar APK Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do repositório (atualizado para v4)
    - name: Checkout do código
      uses: actions/checkout@v4

    # 2. Configura a versão do Java (atualizado para v4)
    - name: Configurar Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. Instala e configura o ambiente do Flutter
    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    # 4. Baixa os pacotes/dependências
    - name: Instalar dependências
      run: flutter pub get

    # 5. Gera o arquivo APK em modo Release
    - name: Gerar APK
      run: flutter build apk --release

    # 6. Envia o APK gerado para download (atualizado para v4)
    - name: Enviar APK para o GitHub
      uses: actions/upload-artifact@v4
      with:
        name: meu-app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk